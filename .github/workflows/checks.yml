name: Checks & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Code Quality & Error Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21: app/build.gradle.kts pins sourceCompatibility and jvmTarget to VERSION_21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Fast compilation check to catch syntax, type, and annotation errors without full APK packaging
      - name: Compile Kotlin & Java
        run: ./gradlew --no-daemon compileUniversalFossDebugKotlin compileUniversalFossDebugJavaWithJavac

      # Android Lint checks against lint-baseline.xml to catch bugs, critical issues, and regressions
      - name: Lint (Bug & Critical Issue Check)
        run: ./gradlew --no-daemon lintUniversalFossDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-universalFossDebug
          path: app/build/reports/lint-results-universalFossDebug.*
          if-no-files-found: ignore

      # Unit tests
      - name: Unit tests
        run: ./gradlew --no-daemon testUniversalFossDebugUnitTest :canvas:test :lyricsProvider:test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
